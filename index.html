<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="link rel="preconnect href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    
</head>
<body>
    <section id="total">
     <div class="header">   <!--contenedor padre-->           
  <div class="left">
    <img src="./assets/logo.png" alt="Logo" class="logo">
    <div class="title"><span class="title">Character Counter</span></div>
  </div>
  <div><button id="settings">
    o
  </button>
</div>
</div>

             
        </div>
            
        <div class="hero">    
                 <h1>Analize your text <br> in real time.</h1>
        </div>
          
      <!--textarea-->
        <div class="text-area">
            <textarea name="" id="text-tarea">design is the silent ambassador of your brand. Simplicity is key to effective communication, creating clarity in every interaction. A great design transforms complex ideas into elegant solutions, making them easy to understand. It blends aesthetic and functionality seamlessly</textarea>
        </div>
        
        <div class="options">  <!--contenedor padre-->    
            
             <!--imputs -->
            <div>
                <input type="checkbox">
                <label>Exclude Spaces</label>
            </div>

            <div class="limit">
                <input type="checkbox">
                <label>Character Limit</label>
            </div type=checkbox>
               <p class="brawl">Approx. reading time:< 1minute</p>  


        </div>
        <!--cuadros-->

        <div class="stats">    <!--contenedor padre-->    
            <div class="card-purple">
                <h2>278</h2>
                <p>Total Character</p>
            </div>
            <div class="yellow">
                <h2>39</h2>
                <p>Total Count</p>
            </div>
            <div class="orange">
                <h2>04</h2>
                <p>Sentence Count</p>
            </div>

        </div>
        
     
</div>
<!--Letter Density-->
      <section class="density">
        <h3 class="density-title">Letter Density</h3>

        <div class="density-row">
          <span class="density-letter">E</span>
          <progress class="density-bar" value="40" max="100"></progress>
          <span class="density-count">40 (16.06%)</span>
        </div>

        <div class="density-row">
          <span class="density-letter">I</span>
          <progress class="density-bar" value="29" max="100"></progress>
          <span class="density-count">29 (11.65%)</span>
        </div>

        <div class="density-row">
          <span class="density-letter">T</span>
          <progress class="density-bar" value="28" max="100"></progress>
          <span class="density-count">28 (11.24%)</span>
        </div>

        <div class="density-row">
          <span class="density-letter">O</span>
          <progress class="density-bar" value="22" max="100"></progress>
          <span class="density-count">22 (8.84%)</span>
        </div>

        <div class="density-row">
          <span class="density-letter">N</span>
          <progress class="density-bar" value="21" max="100"></progress>
          <span class="density-count">21 (8.43%)</span>
        </div>

        <button class="see-more">See more ∨</button>
      </section>
      <!--End Letter Density-->
   

   
    




    </section>

    
</body>
</html>
